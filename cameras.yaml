# =============================================================================
# cameras.yaml - camera list for the cam_wall dashboard
# =============================================================================
#
# Step-by-step guide (finding camera addresses, RTSP URLs, camera settings):
# README.md, section "1. Configure the cameras". Weather station: section 2.
#
# Each entry under "cameras:" describes one camera shown on the wall.
#
# Fields
#   Required:
#     id                    unique camera identifier, used internally (e.g. cam1)
#     rtsp_url              main (hi-res) stream URL
#
#   Optional:
#     name                  label shown to the user (default: the id)
#     rtsp_substream_url    secondary (low-res) stream URL, used on the wall
#     webrtc_url            go2rtc player URL, for reference only (not used)
#     model                 camera model, shown under the name
#     uid                   UID used by the P2P IP Camera Client (leave empty if n/a)
#     username              camera login
#     password              camera password - always a ${CAMx} reference, see below
#     group                 grouping on the wall (e.g. Inside, Outside)
#     enabled               set to false to hide a camera without deleting it
#
# Passwords
#   No passwords are stored in this file. ${CAM1}..${CAM6} are placeholders
#   filled from the .env file in this folder, in both "password" and the
#   credentials part of "rtsp_url". YAML does not expand them itself - the
#   application reading this file must load .env and substitute the values.
#   Keep .env private; never paste real passwords here.
#
# Syntax rules (to keep the file valid YAML)
#   - Use spaces only, never tabs.
#   - Every "- id:" line is indented 2 spaces; all other keys 4 spaces.
#   - Key names have no spaces; always "key: value" (colon + space).
#   - Comments start with "#" and may follow a value on the same line.
#
# Adding a camera
#   1. Copy an existing entry and give it a new id and name.
#   2. Use a new ${CAMx} variable in password and rtsp_url.
#   3. Add CAMx=<password> to .env.
#
# Settings (optional section; without it the defaults below apply)
#   tailscale   remote access through Tailscale VPN:
#                 auto - use Tailscale if it runs on this computer (default)
#                 on   - always; warn if Tailscale is not running
#                 off  - never; home network only
#   weather     temperature from the TH16-R2 weather station (folder th16/):
#                 auto - show it if th16/devices.json exists (default)
#                 on   - always; stop with an error if it cannot be used
#                 off  - never
#               Station IP, names and refresh times: th16/th16_config.json
#   pause_hidden_after
#               seconds the cameras keep streaming after the page is hidden
#               (window minimized, other tab) and the wall keeps streaming
#               behind an enlarged camera; coming back sooner needs no
#               reconnect. 0 = pause at once. Default: 60
#
# =============================================================================

settings:
  tailscale: auto
  weather: auto
  pause_hidden_after: 60

cameras:

  - id: cam1                                                              
    model: IKTP430LV2 B4                                                  
    uid:                                                                  
    name: ganek                                                           
    rtsp_url: rtsp://admin:${CAM1}@192.168.1.201:554/0
    rtsp_substream_url: rtsp://admin:${CAM1}@192.168.1.201:554/1                
    webrtc_url: http://localhost:1984/stream.html?src=camera1&mode=webrtc 
    username: admin                                                       
    password: ${CAM1}                                                     
    group: Outside                                                        
                                                                          # for this camera to work in go2rtc set codec type to H.264/base profile
                                                                          # for this camera to detect day/night set sensitivity to 7 (Image -> Day and Night -> Sensitivity)

